name: CI

# The COMMIT -> TAG half. Everything that decides whether a commit is good, plus
# the cog auto-bump that cuts the version tag on main. Nothing here publishes.
#
#   pull_request  cargo-deny + commitlint + lint + test + build
#   push:main     the same, then `tag` (cog --auto) if the commits warrant a bump
#   schedule      nightly cargo-deny at 04:00 UTC to surface fresh advisories
#
# The tag it pushes is what fires release.yml (TAG -> crates.io + GH release).
# That hand-off only works because the tag is pushed with a PAT: a tag pushed
# with the default GITHUB_TOKEN does NOT trigger another workflow, by design,
# so the release would silently never run.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # the cog bump commit + tag push on main

env:
  CARGO_TERM_COLOR: always

jobs:
  # Supply-chain enforcement. Runs on every PR + nightly cron @ 04:00 UTC.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  commitlint:
    name: Commit lint (conventional-commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Declaring ANY top-level `permissions:` sets every unlisted scope to
    # `none`, so the workflow-level `contents: write` silently left this job
    # unable to list the PR's commits — it failed with "Resource not accessible
    # by integration", which reads like a bad commit message rather than a
    # missing scope. Only surfaces on a pull_request, so a repo that pushes
    # straight to main never sees it.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, cargo
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-stable-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-lint-

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (code smells check)
        run: |
          cargo clippy --version
          # Focused practical-smell set; intentionally relaxed on a
          # few `clippy::style` lints that fire heavily in big-int and
          # cryptographic code.
          cargo clippy --all-targets --all-features -- -D warnings \
            -D clippy::dbg_macro \
            -D clippy::print_stdout \
            -D clippy::print_stderr \
            -D clippy::todo \
            -D clippy::unimplemented \
            -D clippy::exit \
            -D clippy::cast_lossless \
            -D clippy::clone_on_ref_ptr \
            -D clippy::empty_enums \
            -D clippy::enum_glob_use \
            -D clippy::if_not_else \
            -D clippy::mut_mut \
            -D clippy::non_ascii_literal \
            -D clippy::single_match_else \
            -D clippy::string_add \
            -D clippy::string_add_assign \
            -D clippy::string_lit_as_bytes \
            -D clippy::unnecessary_unwrap \
            -D clippy::useless_let_if_seq \
            -A clippy::module_name_repetitions \
            -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc \
            -A clippy::too_many_lines \
            -A clippy::similar_names \
            -A clippy::inline_always \
            -A clippy::unwrap_used \
            -A clippy::expect_used \
            -A clippy::panic \
            -A clippy::cast_possible_truncation \
            -A clippy::cast_possible_wrap \
            -A clippy::cast_precision_loss \
            -A clippy::cast_sign_loss \
            -A clippy::unused_self \
            -A unused_imports \
            -A unused_macros \
            -A dead_code

      - name: Check documentation builds
        run: cargo doc --no-deps --all-features --document-private-items

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
        include:
          - rust: nightly
            allow_failure: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy, cargo
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: ${{ matrix.rust == 'nightly' }}

      - name: Run clippy
        run: |
          cargo clippy --version
          cargo clippy --all-targets --all-features -- -D warnings \
            -D clippy::dbg_macro \
            -D clippy::print_stdout \
            -D clippy::print_stderr \
            -A clippy::unwrap_used \
            -A clippy::expect_used \
            -A clippy::panic
        continue-on-error: ${{ matrix.rust == 'nightly' }}

      - name: Run tests (default features — no_std)
        run: cargo test --verbose

      - name: Run tests (all features — std)
        run: cargo test --verbose --all-features

      - name: Build (default features)
        run: cargo build --verbose --release

      - name: Build (all features)
        run: cargo build --verbose --release --all-features

      # A host build of a `#![no_std]` crate still links against std happily,
      # so re-running it proves nothing. Only a target WITHOUT a std
      # implementation catches an accidental std dependency — and the mobile
      # wallet is the consumer that would otherwise discover it for us.
      - name: Add a bare-metal target
        run: rustup target add thumbv7em-none-eabi
      - name: Check the default feature set is genuinely no_std
        run: cargo build --verbose --release --no-default-features --target thumbv7em-none-eabi

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, cargo
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-
      - name: Build
        run: cargo build --verbose --release --all-features

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: target/release/
          if-no-files-found: ignore

  # ----------------------------------------------------------------
  # Version bump + tag. Runs after every check on `push: main`.
  # ----------------------------------------------------------------

  # ----------------------------------------------------------------
  # The hand-off to release.yml. cog decides the bump from the
  # conventional-commit history; if it cuts a tag, pushing that tag is
  # what starts the release half.
  # ----------------------------------------------------------------
  tag:
    name: Bump version & tag
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(version):') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      # PSONET_REPO_TOKEN, not GITHUB_TOKEN. A push authenticated with the
      # default token never triggers another workflow — GitHub blocks that to
      # stop workflows recursing — so a tag pushed with it would sit there and
      # release.yml would never fire. The PAT is what makes the hand-off work.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PSONET_REPO_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cocogitto bump
        uses: cocogitto/cocogitto-action@v4
        with:
          command: bump
          args: --auto
          git-user: "github-actions[bot]"
          git-user-email: "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve created tag (if any)
        id: bump
        run: |
          set -euo pipefail
          tag="$(git tag --points-at HEAD | grep '^v' | head -n1 || true)"
          echo "tag=${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "No version bump warranted by these commits; release.yml will not fire."
          else
            echo "Pushed $tag — release.yml takes it from here."
          fi
