name: CI

# The COMMIT -> TAG half. Everything that decides whether a commit is good, plus
# the cog auto-bump that cuts the version tag on main. Nothing here publishes.
#
#   pull_request  supply chain + commitlint + lint + test + build
#   push:main     the same, then `tag` (cog --auto) if the commits warrant a bump
#   schedule      nightly supply-chain run at 04:00 UTC to surface fresh advisories
#
# The tag it cuts is what starts release.yml (TAG -> crates.io + GH release).
# GitHub will not trigger a workflow from a push authenticated with the default
# GITHUB_TOKEN — that is how it stops workflows recursing — so the tag job
# DISPATCHES release.yml explicitly instead. That needs `actions: write`, and it
# keeps the whole flow on GITHUB_TOKEN rather than a PAT.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # the cog bump commit + tag push on main
  actions: write # the tag job dispatches release.yml after a bump

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------------------- #
  # Supply chain. One job, the same four questions in every psonet repo:
  # are the licences ones we may ship, do the git sources resolve to hosts
  # we trust, are duplicate versions under control, and is anything in the
  # tree the subject of a published advisory.
  #
  # Runs on every PR and on the nightly cron, so an advisory published
  # against a dependency that nobody touched still surfaces within a day.
  # --------------------------------------------------------------- #
  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      # Licences, git sources and bans gate. All three pass on this tree
      # today, so a regression here is a new fact and fails the build.
      - name: cargo deny (licenses, sources, bans)
        run: cargo deny --all-features check licenses sources bans

      # Gates. This tree carries no advisories today, which is the state the
      # repo's own `cargo deny check all` already held it to; splitting the
      # command must not quietly relax that. A new advisory here is either a
      # dependency to upgrade or an entry with a reason in deny.toml's
      # [advisories].
      - name: cargo deny (advisories)
        run: cargo deny --all-features check advisories

      # A separate RUSTSEC database revision from cargo-deny's, so a
      # freshly-published advisory surfaces from whichever updates first.
      # Reports rather than gates: the gate above is the one with a
      # deliberate ignore list behind it.
      - name: cargo audit
        continue-on-error: true
        run: cargo audit || echo "::warning::cargo audit found advisories. Not gating yet."

  commitlint:
    name: Commit lint (conventional-commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Declaring ANY top-level `permissions:` sets every unlisted scope to
    # `none`, so the workflow-level `contents: write` silently left this job
    # unable to list the PR's commits — it failed with "Resource not accessible
    # by integration", which reads like a bad commit message rather than a
    # missing scope. Only surfaces on a pull_request, so a repo that pushes
    # straight to main never sees it.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, cargo
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-stable-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-lint-

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (code smells check)
        run: |
          cargo clippy --version
          # Focused practical-smell set; intentionally relaxed on a
          # few `clippy::style` lints that fire heavily in big-int and
          # cryptographic code.
          cargo clippy --all-targets --all-features -- -D warnings \
            -D clippy::dbg_macro \
            -D clippy::print_stdout \
            -D clippy::print_stderr \
            -D clippy::todo \
            -D clippy::unimplemented \
            -D clippy::exit \
            -D clippy::cast_lossless \
            -D clippy::clone_on_ref_ptr \
            -D clippy::empty_enums \
            -D clippy::enum_glob_use \
            -D clippy::if_not_else \
            -D clippy::mut_mut \
            -D clippy::non_ascii_literal \
            -D clippy::single_match_else \
            -D clippy::string_add \
            -D clippy::string_add_assign \
            -D clippy::string_lit_as_bytes \
            -D clippy::unnecessary_unwrap \
            -D clippy::useless_let_if_seq \
            -A clippy::module_name_repetitions \
            -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc \
            -A clippy::too_many_lines \
            -A clippy::similar_names \
            -A clippy::inline_always \
            -A clippy::unwrap_used \
            -A clippy::expect_used \
            -A clippy::panic \
            -A clippy::cast_possible_truncation \
            -A clippy::cast_possible_wrap \
            -A clippy::cast_precision_loss \
            -A clippy::cast_sign_loss \
            -A clippy::unused_self \
            -A unused_imports \
            -A unused_macros \
            -A dead_code

      - name: Check documentation builds
        run: cargo doc --no-deps --all-features --document-private-items

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
        include:
          - rust: nightly
            allow_failure: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy, cargo
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: ${{ matrix.rust == 'nightly' }}

      - name: Run clippy
        run: |
          cargo clippy --version
          cargo clippy --all-targets --all-features -- -D warnings \
            -D clippy::dbg_macro \
            -D clippy::print_stdout \
            -D clippy::print_stderr \
            -A clippy::unwrap_used \
            -A clippy::expect_used \
            -A clippy::panic
        continue-on-error: ${{ matrix.rust == 'nightly' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # --profile ci: retries, fail-fast off and the JUnit report that the
      # flaky reporter below reads. Same runner, same profile name, in every
      # psonet repo.
      - name: Test (nextest, default features — no_std)
        run: cargo nextest run --profile ci

      # Retries turn a slow runner into a pass and hide that the test is
      # unstable. This reads the JUnit report back and warns per test that only
      # survived on a retry. Never fails the job.
      - name: Report flaky tests (default features)
        if: always()
        run: |
          command -v python3 >/dev/null 2>&1 || {
            echo "::notice::python3 unavailable; skipping the flaky-test report"
            exit 0
          }
          python3 .github/scripts/warn_flaky.py target/nextest/ci/junit.xml

      - name: Test (nextest, all features — std)
        run: cargo nextest run --profile ci --all-features

      # Retries turn a slow runner into a pass and hide that the test is
      # unstable. This reads the JUnit report back and warns per test that only
      # survived on a retry. Never fails the job.
      - name: Report flaky tests (all features)
        if: always()
        run: |
          command -v python3 >/dev/null 2>&1 || {
            echo "::notice::python3 unavailable; skipping the flaky-test report"
            exit 0
          }
          python3 .github/scripts/warn_flaky.py target/nextest/ci/junit.xml

      # nextest builds and runs each test in its own process, which is what
      # makes retries and partitioning possible — but it cannot run doctests.
      # Without this line they would silently stop being tested.
      - name: cargo test --doc
        run: cargo test --doc --all-features

      - name: Build (default features)
        run: cargo build --verbose --release

      - name: Build (all features)
        run: cargo build --verbose --release --all-features

      # A host build of a `#![no_std]` crate still links against std happily,
      # so re-running it proves nothing. Only a target WITHOUT a std
      # implementation catches an accidental std dependency — and the mobile
      # wallet is the consumer that would otherwise discover it for us.
      - name: Add a bare-metal target
        run: rustup target add thumbv7em-none-eabi
      - name: Check the default feature set is genuinely no_std
        run: cargo build --verbose --release --no-default-features --target thumbv7em-none-eabi

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, cargo
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-
      - name: Build
        run: cargo build --verbose --release --all-features

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: target/release/
          if-no-files-found: ignore

  # ----------------------------------------------------------------
  # Version bump + tag. Runs after every check on `push: main`.
  # ----------------------------------------------------------------

  # ----------------------------------------------------------------
  # The hand-off to release.yml. cog decides the bump from the
  # conventional-commit history; if it cuts a tag, this job starts the
  # release half explicitly.
  # ----------------------------------------------------------------
  # Spelling. Cheap, no toolchain. The allow-list in typos.toml holds only
  # checked false positives, so a hit here is worth reading.
  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1.50.2
        with:
          config: ./typos.toml

  # pso-antispam publishes to crates.io; the node and the mobile wallet both
  # pin it, and they must agree on the admission contract.
  semver:
    name: semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      # A version never published yet has no baseline; that is a skip, not a
      # failure. `--workspace` follows whatever the manifests mark publishable,
      # so adding a crate does not mean editing this line.
      - run: cargo semver-checks check-release --workspace --all-features

  # Coverage. Reported, never enforced: a threshold set before anyone has seen
  # the number is a guess. Deliberately outside the `ci` aggregator's needs, so
  # a slow or failed coverage run cannot hold up a merge.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Scoped to this job rather than the workflow: the sticky comment is the
    # only thing here that writes to the pull request.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --workspace --profile ci --lcov --output-path lcov.info

      # `--summary-only` prints a fixed-width table meant for a terminal, which
      # renders as a wall of unaligned text in Markdown. Read the JSON instead.
      - name: Render coverage report
        run: |
          cargo llvm-cov report --json --summary-only --output-path coverage.json
          python3 .github/scripts/coverage_report.py coverage.json > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      # One comment rewritten in place on each push; `header` makes it sticky.
      - name: Coverage PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage.md

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage.json
            coverage.md
          retention-days: 14

  # One required status for branch protection. Without it, adding a job means
  # editing the protected-branch settings too, and a job skipped for a
  # legitimate reason reads as "pending" forever. Fails when any dependency
  # failed or was cancelled; tolerates a skip.
  ci:
    name: ci
    runs-on: ubuntu-latest
    if: always()
    needs: [supply-chain, commitlint, lint, test, build, typos, semver]
    steps:
      - name: Check dependency results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::one or more required jobs did not succeed"
            exit 1
          fi
          echo "all required jobs succeeded or were skipped"

  tag:
    name: Bump version & tag
    runs-on: ubuntu-latest
    needs: [ci]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(version):') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN carries contents:write from the workflow permissions
          # above, which is what cog's post_bump_hooks push with.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Install cog onto PATH. `check` also validates the commit history; the
      # bump itself runs manually below.
      - uses: cocogitto/cocogitto-action@v4
        with:
          command: check

      # Run the bump directly rather than through the action's `command: bump`,
      # to neutralise cog.toml's `branch_whitelist`. The action invokes cog
      # against the CI checkout's ref, which cog does not recognise as `main`,
      # so the whitelist rejects with "bump is not allowed" before a single
      # commit is scanned. The job-level `if:` already restricts this to a push
      # on main, so dropping the in-cog branch guard changes nothing about when
      # a bump can happen.
      - name: Cocogitto bump
        id: bump
        run: |
          set -euo pipefail
          cfg="$(mktemp -d)/cog.toml"
          sed 's/^branch_whitelist.*/branch_whitelist = []/' cog.toml > "$cfg"
          cog --config "$cfg" bump --auto
          tag="$(git tag --points-at HEAD | grep '^v' | head -n1 || true)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "::notice::cut ${tag}"
          else
            echo "::notice::no bump warranted on this push"
          fi

      # A GITHUB_TOKEN-pushed tag cannot re-trigger a workflow, so start
      # release.yml explicitly against the tag just cut.
      - name: Trigger release (release.yml)
        if: steps.bump.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$REPO" --ref "$TAG" -f tag="$TAG"
          echo "::notice::dispatched release.yml for ${TAG}"
